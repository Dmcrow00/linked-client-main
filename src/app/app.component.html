@if (showShell) {
  <app-header></app-header>
}

@if (!showShell) {
  <div class="floating-auth-actions">
    <button mat-icon-button routerLink="/inicio" aria-label="Ir al inicio">
      <mat-icon>home</mat-icon>
    </button>
    <app-theme-toggle-button></app-theme-toggle-button>
  </div>
}

<div class="main-container">
  @if (userLoginOn && userIsAdmin) {
    <app-sweitemmenu></app-sweitemmenu>
  }
  <div class="content-container">
    @if (isLoading$ | async) {
      <app-loading-overlay></app-loading-overlay>
    }
    <router-outlet></router-outlet>
  </div>
</div>
@if (showShell) {
  <app-footer></app-footer>
}

<app-confirmacion />
