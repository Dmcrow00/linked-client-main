<div class="post-tile mat-elevation-z2">

  <div class="image-wrapper">
    <img [src]="trabajo.fotos[currentImageIndex] | serverUrl"
         class="tile-image"
         loading="lazy"
         (error)="hasError = true"
         [hidden]="hasError"
         alt="Tatuaje">

    <div class="error-placeholder" *ngIf="hasError">
      <mat-icon>image_not_supported</mat-icon>
      <span>Imagen no disponible</span>
    </div>

    <ng-container *ngIf="trabajo.fotos.length > 1">
      <button class="nav-btn prev" (click)="prevImage($event)">
        <mat-icon>chevron_left</mat-icon>
      </button>
      <button class="nav-btn next" (click)="nextImage($event)">
        <mat-icon>chevron_right</mat-icon>
      </button>
      <div class="photo-counter">
        {{ currentImageIndex + 1 }}/{{ trabajo.fotos.length }}
      </div>
    </ng-container>
  </div>

  <!-- Overlay de descripción (solo visible en hover en escritorio) -->
  <div class="tile-overlay">
    <p class="desc" *ngIf="trabajo.descripcion">{{ trabajo.descripcion | slice:0:40 }}...</p>
  </div>

  <!-- Barra inferior: siempre visible -->
  <div class="bottom-bar">
    <div class="artist-info" *ngIf="showArtistInfo" (click)="irAlPerfil($event)">
      <img [src]="trabajo.tatuador?.profilePhoto | serverUrl" class="mini-avatar">
      <span class="artist-name">{{ trabajo.tatuador?.username }}</span>
    </div>
    <div class="bar-spacer" *ngIf="!showArtistInfo"></div>
    <button mat-icon-button class="btn-like"
            (click)="onLike($event)"
            [class.liked]="isLiked">
      <mat-icon>{{ isLiked ? 'favorite' : 'favorite_border' }}</mat-icon>
    </button>
  </div>

</div>
