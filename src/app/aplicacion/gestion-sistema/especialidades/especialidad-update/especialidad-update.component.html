<mat-card class="dialog-card">
  <mat-card-header>
    <mat-card-title>Editar Especialidad</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form #especialidadForm="ngForm" class="form-grid">
      <!-- Nombre -->
      <div class="row">
        <mat-form-field class="col-12" appearance="outline">
          <mat-label>Nombre</mat-label>
          <input
            matInput
            type="text"
            [(ngModel)]="especialidad.nombre"
            name="nombre"
            #nombre="ngModel"
            required
            minlength="1"
            />

            @if (especialidad.nombre) {
              <button
                matSuffix
                mat-icon-button
                aria-label="Clear"
                (click)="especialidad.nombre = ''"
                >
                <mat-icon>close</mat-icon>
              </button>
            }

            @if (nombre.invalid && (nombre.dirty || nombre.touched)) {
              <mat-error>
                El nombre no puede estar vacío.
              </mat-error>
            }
          </mat-form-field>
        </div>

        <!-- Descripción -->
        <div class="row">
          <mat-form-field class="col-12" appearance="outline">
            <mat-label>Descripción</mat-label>
            <textarea
              matInput
              rows="4"
              [(ngModel)]="especialidad.descripcion"
              name="descripcion"
              #descripcion="ngModel"
              required
              minlength="1"
            ></textarea>

            @if (descripcion.invalid && (descripcion.dirty || descripcion.touched)) {
              <mat-error>
                La descripción no puede estar vacía.
              </mat-error>
            }
          </mat-form-field>
        </div>
      </form>
    </mat-card-content>

    <mat-card-actions class="action-buttons">
      <button mat-stroked-button color="warn" type="button" (click)="cancel()">
        Cancelar
      </button>

      <button
        mat-raised-button
        class="create-button"
        type="submit"
        appNoDoubleSubmit
        (click)="onUpdateEspecialidad()"
        [disabled]="especialidadForm.invalid"
        >
        Actualizar
      </button>
    </mat-card-actions>
  </mat-card>
