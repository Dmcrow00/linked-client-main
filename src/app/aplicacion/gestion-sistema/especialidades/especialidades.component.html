<div>

  <div class="title-crud">
    <h3>Especialidades</h3>
  </div>

  <div class="tabla-crud normal-table row">
    @if (lista.error(); as error) {
      <div class="lista-error" role="alert">
        <span>{{ error }}</span>
        <button mat-stroked-button type="button" (click)="lista.load()">Reintentar</button>
      </div>
    }
    <table mat-table [dataSource]="lista.items()" class="mat-elevation-z8">
      <!-- ID  -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef style="width: 10%;">ID</th>
        <td mat-cell *matCellDef="let row" style="width: 10%; text-align: center;">{{ row.id }}</td>
      </ng-container>

      <!-- User -->
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef style="width: 20%;">Nombre</th>
        <td mat-cell *matCellDef="let row" style="width: 30%; text-align: center;">{{ row.nombre }}</td>
      </ng-container>

      <ng-container matColumnDef="desc">
        <th mat-header-cell *matHeaderCellDef style="width: 30%;">Descripcion</th>
        <td mat-cell *matCellDef="let row" style="width: 20%; text-align: center;">
          {{ row.descripcion }}

        </td>
      </ng-container>

      <!--  Acciones -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef style="width: 10%;">Acciones</th>
        <td mat-cell *matCellDef="let row" style="width: 10%; text-align: center;">
          <button mat-icon-button aria-label="Ver" (click)="showDetails(row)">
            <mat-icon>visibility</mat-icon>
          </button>
          <button mat-icon-button aria-label="Editar" (click)="openEditDialog(row)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" aria-label="Eliminar" [disabled]="lista.deleting()" (click)="openDeleteDialog(row)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns()"></tr>
    </table>
    @if (lista.empty()) {
      <p class="lista-vacia">Todavía no hay especialidades.</p>
    }
    <button mat-icon-button class="add-btn" aria-label="Añadir" (click)="openCreateDialog()"
      style="background-color: #4a513e; color:white; margin-top: 1vh;">
      <mat-icon>add</mat-icon>
    </button>
  </div>
</div>
