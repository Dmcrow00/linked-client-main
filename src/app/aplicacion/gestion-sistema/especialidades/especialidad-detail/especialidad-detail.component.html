<mat-card class="detail-view-card">
  <mat-card-header>
    <div mat-card-avatar class="header-icon">
      <mat-icon>brush</mat-icon>
    </div>
    <mat-card-title>{{ data.especialidad.nombre }}</mat-card-title>
    <mat-card-subtitle>ID: {{ data.especialidad.id }}</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <div class="detail-grid">
      <div class="detail-item">
        <span class="label">Descripción:</span>
        <span>{{ data.especialidad.descripcion || '—' }}</span>
      </div>

      <div class="detail-item">
        <span class="label">Estado:</span>
        <span>{{ data.especialidad.status === 'true' ? 'Activo' : 'Inactivo' }}</span>
      </div>
    </div>
  </mat-card-content>

  <mat-card-actions align="end">
    <button mat-stroked-button (click)="onClose()">Cerrar</button>
  </mat-card-actions>
</mat-card>
