<div class="modal-container">

  <div class="drag-handle"></div>

  <!-- Imagen -->
  <div class="media-column">

    <button class="close-btn" mat-icon-button mat-dialog-close>
      <mat-icon>close</mat-icon>
    </button>

    <div class="image-wrapper">
      <img [src]="data.trabajo.fotos[currentImageIndex] | serverUrl"
           class="main-image"
           alt="Detalle trabajo">
    </div>

    <ng-container *ngIf="data.trabajo.fotos.length > 1">
      <button class="nav-btn prev" (click)="prevImage()">
        <mat-icon>chevron_left</mat-icon>
      </button>
      <button class="nav-btn next" (click)="nextImage()">
        <mat-icon>chevron_right</mat-icon>
      </button>
      <div class="dots-indicator">
        <span *ngFor="let foto of data.trabajo.fotos; let i = index"
              class="dot"
              [class.active]="i === currentImageIndex"></span>
      </div>
    </ng-container>

  </div>

  <!-- Información debajo de la imagen -->
  <div class="info-column">

    <div class="modal-header">
      <div class="author-info" (click)="irAlPerfil()">
        <img [src]="data.trabajo.tatuador?.profilePhoto | serverUrl"
             class="avatar"
             alt="Avatar">
        <div class="names">
          <span class="realname">{{ data.trabajo.tatuador?.realname }}</span>
          <span class="username">{{ '@' + data.trabajo.tatuador?.username }}</span>
        </div>
      </div>
    </div>

    <mat-divider></mat-divider>

    <div class="modal-body">
      <div class="description-card">
        <p class="description">{{ data.trabajo.descripcion || 'Sin descripción.' }}</p>
      </div>
      <p class="date">Publicado el {{ data.trabajo.creationTimestamp | date:'longDate' }}</p>
    </div>

    <mat-divider></mat-divider>

    <div class="modal-footer">
      <div class="actions">
        <button mat-icon-button appNoDoubleSubmit [submitDelay]="800" (click)="toggleLike()" [class.liked]="isLiked">
          <mat-icon>{{ isLiked ? 'favorite' : 'favorite_border' }}</mat-icon>
        </button>
      </div>
      <div class="likes-info">{{ likesCount }} Me gusta</div>
    </div>

  </div>

</div>
