<mat-card class="dialog-card">
  <mat-card-header>
    <mat-card-title>Actualizar roles — {{ user.username }}</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <p class="roles-label">Seleccioná los roles asignados:</p>
    <div class="roles-chips">
      @for (rol of allRoles; track rol) {
        <button
          type="button"
          class="rol-chip"
          [class.selected]="isRolSelected(rol.id!)"
          (click)="toggleRol(rol.id!)">
          {{ rol.description }}
        </button>
      }
    </div>
  </mat-card-content>

  <mat-card-actions class="action-buttons">
    <button mat-stroked-button color="warn" type="button" (click)="cancel()">
      Cancelar
    </button>
    <button mat-raised-button class="normal-button" type="button" appNoDoubleSubmit
      (click)="onUpdateUser()"
      [disabled]="saving || selectedRoleIds.length === 0">
      {{ saving ? 'Guardando…' : 'Guardar' }}
    </button>
  </mat-card-actions>
</mat-card>
