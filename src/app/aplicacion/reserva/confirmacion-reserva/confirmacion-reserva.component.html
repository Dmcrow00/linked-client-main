<div class="screen-container">
  
  <div class="content">
    
    <div class="success-animation">
      <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
        <circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none" />
        <path class="checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8" />
      </svg>
    </div>

    <h2 class="title">¡Solicitud Enviada!</h2>
    <p class="subtitle">El tatuador revisará tu idea y te confirmará pronto.</p>

    <div class="ticket-card mat-elevation-z3">
      
      <div class="ticket-header">
        <span class="label">TATUADOR</span>
        <div class="artist-info">
            <img [src]="reserva.tatuador?.profilePhoto | serverUrl"
                 class="avatar" 
                 alt="Avatar"
                 onerror="this.src='assets/images/default-profile.jpg'"> 
            <span class="artist-name">{{ reserva.tatuador?.realname }} {{ reserva.tatuador?.surname }}</span>
        </div>
      </div>

      <div class="ticket-divider">
        <div class="notch-left"></div>
        <div class="dashed-line"></div>
        <div class="notch-right"></div>
      </div>

      <div class="ticket-body">
        <div class="info-row">
            <div class="info-item">
                <mat-icon>calendar_today</mat-icon>
                <div>
                    <span class="label">FECHA</span>
                    <span class="value">{{ reserva.fechaHoraInicio | date: 'dd/MM/yyyy' }}</span>
                </div>
            </div>
            <div class="info-item">
                <mat-icon>schedule</mat-icon>
                <div>
                    <span class="label">HORA</span>
                    <span class="value">{{ reserva.fechaHoraInicio | date: 'HH:mm' }} hs</span>
                </div>
            </div>
        </div>
      </div>

    </div>

    <div class="actions">
        <button mat-flat-button class="btn-primary create-btn" (click)="volverInicio()">
            Volver al Inicio
        </button>
        <button mat-button class="btn-secondary" (click)="goBack()">
            Ver mis turnos
        </button>
    </div>

  </div>
</div>
